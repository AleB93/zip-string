<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zip-string demo</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e3e3e3; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#999; --line:#2c2c2c; --accent:#60a5fa; } }
  body { margin:0; padding:16px; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); max-width:1100px; margin-inline:auto; }
  textarea { width:100%; box-sizing:border-box; min-height:140px; font:12px ui-monospace, monospace; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; margin:8px 8px 8px 0; }
  .muted { color:var(--muted); }
  .stats { font-variant-numeric:tabular-nums; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { border-bottom:1px solid var(--line); padding:4px 8px; text-align:left; white-space:nowrap; }
  .wrap { overflow:auto; max-height:60vh; }
  svg { width:100%; height:120px; display:block; }
  #link { word-break:break-all; font:11px ui-monospace, monospace; max-height:4.5em; overflow:hidden; }
</style>
</head>
<body>
<h1>zip-string</h1>

<section id="maker">
  <p class="muted">Paste JSON (ideally an array of objects), get a URL whose <code>#fragment</code> carries all of it.</p>
  <textarea id="input"></textarea>
  <button id="sample">Load 5,000-row sample</button>
  <button id="make">Create link</button>
  <div class="stats" id="stats"></div>
  <div id="link"></div>
</section>

<section id="view" hidden>
  <p class="stats muted" id="viewStats"></p>
  <svg id="chart" preserveAspectRatio="none"></svg>
  <div class="wrap"><table id="table"></table></div>
  <button id="edit">Make another link</button>
</section>

<script type="importmap">{ "imports": { "fflate": "./node_modules/fflate/esm/browser.js" } }</script>
<script type="module">
import { encode, decode } from "./src/index.js";
const $ = (id) => document.getElementById(id);
const kb = (n) => (n / 1024).toFixed(1) + " KB";

$("sample").onclick = () => {
  const cities = ["Rome", "Milan", "Paris", "Berlin", "Madrid", "London"];
  let t = Date.UTC(2026, 0, 1), price = 100;
  const rows = Array.from({ length: 5000 }, (_, i) => {
    t += 60000; price = Math.round((price + (Math.random() - 0.5) * 2) * 100) / 100;
    return { id: i + 1, ts: t, city: cities[(Math.random() * 6) | 0], price, qty: (Math.random() * 50) | 0 };
  });
  $("input").value = JSON.stringify(rows);
};

$("make").onclick = async () => {
  const json = $("input").value;
  const s = encode(JSON.parse(json), { target: "hash" });
  const url = location.origin + location.pathname + "#" + s;
  $("stats").textContent = `JSON ${kb(json.length)} → URL ${kb(url.length)} (${(json.length / url.length).toFixed(1)}× smaller)`;
  $("link").innerHTML = `<a href="${url}">${url}</a>`;
  try { await navigator.clipboard.writeText(url); $("stats").textContent += " — copied"; } catch {}
};

$("edit").onclick = () => { location.hash = ""; };

async function render() {
  const s = decodeURIComponent(location.hash.slice(1));
  $("maker").hidden = !!s; $("view").hidden = !s;
  if (!s) return;
  const t0 = performance.now();
  const data = decode(s);
  const ms = (performance.now() - t0).toFixed(0);
  const rows = Array.isArray(data) ? data : [data];
  const keys = [...new Set(rows.flatMap((r) => (r && typeof r === "object" ? Object.keys(r) : ["value"])))];
  $("viewStats").textContent = `${rows.length.toLocaleString()} rows decoded from a ${kb(location.href.length)} URL in ${ms} ms`;

  // first numeric column (not id-like) as a line chart
  const numKey = keys.find((k) => k !== "id" && rows.every((r) => typeof r[k] === "number") && !/^(ts|time|date)/i.test(k));
  const svg = $("chart"); svg.innerHTML = "";
  if (numKey) {
    const ys = rows.map((r) => r[numKey]), min = Math.min(...ys), max = Math.max(...ys) || 1;
    const W = 1000, H = 120, step = Math.max(1, Math.floor(ys.length / W));
    let d = "";
    for (let i = 0; i < ys.length; i += step) d += `${d ? "L" : "M"}${(i / (ys.length - 1 || 1)) * W},${H - ((ys[i] - min) / (max - min || 1)) * (H - 8) - 4}`;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  }

  // table: render first 500 rows (rendering is the slow part, not decoding)
  const esc = (v) => String(v ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const cell = (v) => esc(v !== null && typeof v === "object" ? JSON.stringify(v) : v);
  const shown = rows.slice(0, 500);
  $("table").innerHTML =
    `<thead><tr>${keys.map((k) => `<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>` +
    shown.map((r) => `<tr>${keys.map((k) => `<td>${cell(r?.[k] ?? (keys[0] === "value" ? r : ""))}</td>`).join("")}</tr>`).join("") +
    `</tbody>` + (rows.length > 500 ? `<caption class="muted" style="caption-side:bottom">showing 500 of ${rows.length.toLocaleString()}</caption>` : "");
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
